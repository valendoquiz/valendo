<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectando · Valendo!</title><style>:root{--bg:#faf8ff;--tx:#1d1730;--mut:#5f587a;--pri:#6d28d9}@media (prefers-color-scheme:dark){:root{--bg:#141020;--tx:#efeaf9;--mut:#a59cbd;--pri:#a78bfa}}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:760px;margin:0 auto;padding:32px 16px 64px}h1{color:var(--pri)}a{color:var(--pri)}footer{color:var(--mut);font-size:14px;margin-top:40px}nav a{margin-right:14px}</style></head><body><main>
<h1>Conectando…</h1>
<p id="msg">Voltando para o Painel Valendo no seu computador.</p>
<script>
// Repassa o retorno do login (code/state) para o painel que roda no seu computador.
(function(){
  var q = new URLSearchParams(location.search);
  var state = q.get("state") || "";
  var prov = state.split(".")[0];
  if (["meta","tiktok","google","instagram"].indexOf(prov) < 0) {
    document.getElementById("msg").textContent = "Retorno de login inválido. Volte ao painel e tente de novo.";
    return;
  }
  location.replace("http://localhost:8765/oauth/" + prov + location.search);
})();
</script>
<noscript>Ative o JavaScript para concluir o login.</noscript>
</main></body></html>
